<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kevin Bacon Machine</title>
    <meta name="description" content="Find the shortest path from any actor to Kevin Bacon.">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>

<body>

    <main>

        <h1 id="pageHeading">Kevin Bacon Machine</h1>

        <p>
            Search for an actor and find the shortest path to Kevin Bacon through movies and co-actors.
        </p>

        <div id="tvCorner" aria-hidden="true">
            <img class="tvStatic" src="images/tvstatic.gif" alt="">
            <img class="tvFrame" src="images/tv.png" alt="">
            <img class="tvScreen" src="images/kevinbacon4.webp" alt="">
        </div>

        <form id="searchForm">
            <label for="actorInput">Search for an actor</label>

            <input type="search" id="actorInput" name="actor" placeholder="e.g. Tom Hanks"
                autocomplete="off" required>

            <button id="searchButton" type="submit">Search</button>
        </form>

        <output id="message" aria-live="polite"></output>

        <div id="loadingIndicator" role="status" aria-live="polite" hidden>
            <img src="images/loadingicon.webp" alt="" aria-hidden="true">
            <span>Calculating Bacon number...</span>
        </div>

        <section id="resultArea"></section>

    </main>

    <footer id="siteFooter">
        <p id="datasetInfo"></p>
        <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">
            <img id="tmdbLogo" src="images/tmdb_logo.svg" alt="The Movie Database (TMDB)">
        </a>
        <p>
            Actor images from <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.
            This product uses the TMDB API but is not endorsed or certified by TMDB.
        </p>
    </footer>

    <template id="movieTemplate">
        <div class="movieNode"></div>
    </template>

    <template id="actorTemplate">
        <article class="actorNode">
            <img class="actorImage" alt="" hidden>
            <h3 class="actorName"></h3>
        </article>
    </template>

</body>

</html>
